<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Healthcare Game App</title>
    <script>
      /**
       * MediaPipe CDN asset-loader race condition suppressor.
       * Uses three layers to guarantee CRA's dev overlay never sees these errors:
       *  1. window.onerror returning true  — oldest/most reliable mechanism
       *  2. capture-phase addEventListener + stopImmediatePropagation
       *     — prevents any later listener (including CRA overlay) from running
       *  3. unhandledrejection handler for promise-based variants
       */
      (function () {
        function isMediaPipeError(msg, src) {
          var m = msg || '';
          var s = src || '';
          return (
            s.indexOf('mediapipe') !== -1 ||
            s.indexOf('jsdelivr.net/npm/@mediapipe') !== -1 ||
            m.indexOf('hands_solution_packed_assets') !== -1 ||
            m.indexOf('pose_solution_packed_assets') !== -1 ||
            m.indexOf('@mediapipe') !== -1
          );
        }

        // Layer 1: window.onerror — returning true suppresses the error
        window.onerror = function (message, source) {
          if (isMediaPipeError(message, source)) return true;
        };

        // Layer 2: capture-phase listener with stopImmediatePropagation
        // This fires before CRA's overlay and prevents it from ever seeing the event
        window.addEventListener('error', function (event) {
          if (isMediaPipeError(event.message, event.filename)) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        // Layer 3: promise rejections
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason || {};
          var msg = reason.message || String(reason);
          if (isMediaPipeError(msg, '')) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
